<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sürpriz!</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: radial-gradient(circle, #FFDAC1 0%, #FF9AA2 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center;}
        #gift-box { font-size: 8rem; cursor: pointer; animation: bounce 2s infinite; user-select: none; }
        #gift-box:hover { transform: scale(1.1); }
        #surprise-container { display: none; background: rgba(255,255,255,0.95); padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 90%; width: 500px; }
        #surprise-media { width: 100%; max-height: 300px; object-fit: contain; border-radius: 10px; margin-bottom: 20px; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-20px);} 60% {transform: translateY(-10px);} }
    </style>
</head>
<body>
    <div id="gift-box" onclick="openGift()">🎁</div>
    <p id="instruction" style="margin-top:20px; color: white; font-weight: bold;">Dokun!</p>

    <div id="surprise-container">
        <h2 style="color:#FF6B6B; font-family:'Pacifico',cursive;">İyi ki Varsın!</h2>
        <div id="media-slot"></div>
        <p id="final-message">...</p>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
            <button onclick="location.href='gallery.html'" class="btn" style="background:var(--secondary-color); color:#333;">📸 Fotoğraflar ve Videolar</button>
            <button onclick="location.href='giris.html'" class="btn">Başa Dön ↺ tekrar tekrar izlemek istiyorsan buna basabilirsin(Ana sayfa).</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script>
        function openGift() {
            // Önce veriyi tanımlıyoruz (Bu bloğu yukarı taşıdık)
            const surpriseContent = {
                message: "İyi ki varsın iyi ki doğmuşsun. Nice mutlu beraber senelere. Bu site internet yok olana kadar açık kalacak. Yani dijital ayak izin hep olacak. Şimdi 'fotoğraflar ve videolar' sekmesine gidip fotoları veya videoları inceleyebilirsin. Her yılın bir önceki yılından daha mutlu olması dileğiyle...",
                mediaSrc: "assets/images/surprise.jpeg",
                mediaType: "image"
            };

            document.getElementById('gift-box').style.display = 'none';
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('surprise-container').style.display = 'block';
            
            // Şimdi veriyi kullanabiliriz
            document.getElementById('final-message').innerText = surpriseContent.message;
            const slot = document.getElementById('media-slot');
            
            if(surpriseContent.mediaType === 'image') {
                slot.innerHTML = `<img id="surprise-media" src="${surpriseContent.mediaSrc}">`;
            } else {
                slot.innerHTML = `<video id="surprise-media" src="${surpriseContent.mediaSrc}" controls autoplay></video>`;
            }
            
            launchConfetti();
        }
        
        function launchConfetti() {
            // (Confetti kodların aynı kalıyor, onlara dokunma)
            for(let i=0; i<50; i++) {
                const conf = document.createElement('div');
                conf.innerText = ['🎉', '🎊', '🎈'][Math.floor(Math.random()*3)];
                conf.style.position = 'fixed'; conf.style.left = Math.random()*100+'vw'; conf.style.top = '-10vh';
                conf.style.fontSize = (Math.random()*20+10)+'px'; conf.style.transition='top 3s ease-in, opacity 3s'; conf.style.zIndex='1000';
                document.body.appendChild(conf);
                setTimeout(()=>{conf.style.top='110vh'; conf.style.opacity='0';}, 100);
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
    // Rastgele konum üretici
    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Her 1.5 saniyede bir ekranın rastgele bir yerinde havai fişek patlat
    setInterval(function() {
      confetti({
        angle: randomInRange(55, 125),
        spread: randomInRange(50, 70),
        particleCount: randomInRange(50, 100),
        startVelocity: 30,
        origin: { 
            x: randomInRange(0.1, 0.9), // Ekranın geneline yayılmasını sağlar
            y: Math.random() - 0.2      // Patlama yüksekliğini ayarlar
        }
      });
    }, 1500); // Hız ayarı (1500 milisaniye = 1.5 saniye)
    </script>
</body>
</html>

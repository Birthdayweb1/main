<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intro</title>
    
    <style>
        /* Sadece video için temiz bir sayfa yapısı */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: black;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999; /* En üstte */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }

        video {
            width: 100%;
            height: 100%;
            /* Mobilde kontrollerin altta kalmaması için contain kullanıyoruz */
            object-fit: contain; 
            display: block;
        }
    </style>
</head>
<body>

    <div id="video-container"></div>
    
    <script src="js/data.js"></script>
    <script>
        let currentIntroIndex = 0;
        const container = document.getElementById('video-container');

        // SAYFA YÜKLENDİĞİNDE
        window.onload = function() {
            if(window.parent) {
                // 1. Ana sayfadaki Müzik Player'ı HTML'den gizle (Display None)
                const player = window.parent.document.getElementById('music-player');
                if(player) {
                    player.style.display = 'none'; 
                }

                // 2. Müziği sustur
                if(window.parent.musicControl) {
                    window.parent.musicControl.pause();
                }
            }
            playIntro();
        };

        function playIntro() {
            if (typeof introVideos === 'undefined' || currentIntroIndex >= introVideos.length) {
                goTimeline();
                return;
            }

            container.innerHTML = '';
            const vid = document.createElement('video');
            vid.src = introVideos[currentIntroIndex].src;
            
            // Video Kontrolleri
            vid.controls = true; 
            vid.autoplay = true;
            vid.muted = false; // Sesli başlatmayı dene
            
            // Mobil Uyum
            vid.setAttribute('playsinline', ''); 
            vid.setAttribute('webkit-playsinline', ''); 
            
            vid.onended = function() {
                currentIntroIndex++;
                playIntro();
            };
            
            container.appendChild(vid);
        }

        function goTimeline() {
            // SAYFA DEĞİŞİRKEN ESKİ HALİNE GETİR
            if(window.parent) {
                // 1. Player'ı tekrar görünür yap (Flex olarak)
                const player = window.parent.document.getElementById('music-player');
                if(player) {
                    player.style.display = 'flex'; 
                }

                // 2. Müziği geri aç
                if(window.parent.musicControl) {
                    window.parent.musicControl.resume();
                }
            }
            location.href = 'timeline.html';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
    // Rastgele konum üretici
    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Her 1.5 saniyede bir ekranın rastgele bir yerinde havai fişek patlat
    setInterval(function() {
      confetti({
        angle: randomInRange(55, 125),
        spread: randomInRange(50, 70),
        particleCount: randomInRange(50, 100),
        startVelocity: 30,
        origin: { 
            x: randomInRange(0.1, 0.9), // Ekranın geneline yayılmasını sağlar
            y: Math.random() - 0.2      // Patlama yüksekliğini ayarlar
        }
      });
    }, 1500); // Hız ayarı (1500 milisaniye = 1.5 saniye)
    </script>
</body>
</html>

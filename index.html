<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İyi ki Doğdun!</title>
    <style>
        /* --- 1. ÇERÇEVE SIFIRLAMA --- */
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            overflow: hidden !important; /* Ana sayfada kaydırmayı yasakla */
            background: #000; 
            font-family: sans-serif;
        }

        /* --- 2. IFRAME (PENCERE) AYARLARI --- */
        /* Bu ayarlar videonun taşmasını engeller */
        #content-frame {
            position: absolute; /* Sayfaya çivile */
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            border: none;
            display: block;
        }

        /* --- 3. MÜZİK PLAYER (MASAÜSTÜ İÇİN) --- */
        #music-player {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 99999;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        #song-title { font-size: 0.9rem; font-weight: bold; margin-right: 10px; color: #333; }
        button { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0 5px; }

        /* ========================================= */
        /* 📱 MOBİL İÇİN ÖZEL KURALLAR */
        /* ========================================= */
        @media screen and (max-width: 768px) {
            
            #music-player {
                top: auto !important;    /* Üstten kopar */
                bottom: 20px !important; /* Alta yapıştır */
                
                /* --- KRİTİK ORTALAMA AYARI --- */
                left: 50% !important;    /* Sol kenarı ekranın ortasına koy */
                right: auto !important;
                transform: translateX(-50%) !important; /* Kendini yarısı kadar geri çek (Tam orta) */
                
                width: 90% !important;   /* Genişlet */
                justify-content: space-between;
                padding: 10px 15px !important;
            }

            /* Mobilde Ses Çubuğunu GİZLE */
            #volume-area { display: none !important; }
            
            /* Şarkı ismini kısalt */
            #song-title { 
                font-size: 0.8rem; 
                max-width: 120px; 
                white-space: nowrap; 
                overflow: hidden; 
                text-overflow: ellipsis; 
            }
        }
    </style>
</head>
<body>

    <iframe id="content-frame" src="giris.html" name="myFrame"></iframe>

    <div id="music-player">
        <span id="song-title">🎵 Yükleniyor...</span>
        <button id="prev-btn">⏮️</button>
        <button id="play-pause-btn">⏯️</button>
        <button id="next-btn">⏭️</button>
        
        <div id="volume-area" style="display:flex; align-items:center; gap:5px; border-left:1px solid #ccc; padding-left:10px;">
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" style="width:60px;">
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
